services:
  api:
    build: .
    restart: unless-stopped
    ports: ["8000:8000"]
    env_file: .env
    environment:
      DATABASE_URL: sqlite:////data/ms_nexus.db
    volumes:
      - nexus_data:/data
  video-worker:
    build: .
    restart: unless-stopped
    command: ["python", "-m", "app.video_worker"]
    env_file: .env
    environment:
      DATABASE_URL: sqlite:////data/ms_nexus.db
    volumes:
      - nexus_data:/data
    depends_on:
      - api
volumes:
  nexus_data:
